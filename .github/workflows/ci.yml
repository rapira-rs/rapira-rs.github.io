name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the previous check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for lastUpdated (git history)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VitePress fails the build on dead internal links, so this also acts as a link check.
      # GITHUB_TOKEN: the download page bakes in release data at build time, and
      # anonymous API calls from shared runner IPs hit the rate limit.
      - name: Build with VitePress
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
