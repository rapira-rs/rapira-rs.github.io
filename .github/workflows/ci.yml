name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the previous check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for lastUpdated (git history)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VitePress reports invalid internal links during the build.
      # The download page includes release data during the build.
      # The token prevents shared runner requests from reaching the anonymous API limit.
      - name: Build with VitePress
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
