name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The download page includes release data during the build.
  # Therefore, each Rapira release requires a new site build.
  # The rapira and rapira-windows release workflows send this event
  # (`gh api repos/rapira-rs/rapira-rs.github.io/dispatches -f event_type=rapira-release`
  # with a fine-grained PAT for this repository).
  # The scheduled run covers a release event that did not start the workflow.
  repository_dispatch:
    types: [rapira-release]
  schedule:
    - cron: '23 3,15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for lastUpdated (git history)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # The download page includes release data during the build.
      # The token prevents shared runner requests from reaching the anonymous API limit.
      - name: Build with VitePress
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  # Deploy the site.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
